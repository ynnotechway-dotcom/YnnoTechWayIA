name: Build APK YNNOTECHWAY IA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Créer package.json
        run: npm init -y

      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Préparer le dossier www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialiser Capacitor
        run: npx cap init "YNNOTECHWAY IA" "com.ynnotechway.ia" --web-dir=www

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l’APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload de l’APK
        uses: actions/upload-artifact@v4
        with:
          name: YNNOTECHWAY-IA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
