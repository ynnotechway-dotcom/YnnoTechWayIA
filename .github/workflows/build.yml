name: Build APK YNNOTECHWAY IA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les paquets Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Créer package.json
        run: npm init -y

      - name: Installer Capacitor 6
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Préparer le dossier www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialiser Capacitor
        run: npx cap init "YNNOTECHWAY IA" "com.ynnotechway.ia" --web-dir=www

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Définir le chemin du SDK Android
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Compiler l’APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload de l’APK
        uses: actions/upload-artifact@v4
        with:
          name: YNNOTECHWAY-IA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
